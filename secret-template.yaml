# K8s secret template — copy, fill in values, apply manually. Never commit with real values.
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-api-secret
  namespace: portfolio-api
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "YOUR_CLIENT_ID.apps.googleusercontent.com"
  OWNER_GOOGLE_EMAIL: "your-owner-email@gmail.com"
  SERVICE_NAME: "portfolio"
  PROTECTED_EMAIL: "your-contact@email.com"
  PROTECTED_PHONE: "your-phone-number"
  MONGODB_URI: "mongodb://admin:PASSWORD@mongodb.mongodb.svc.cluster.local:27017/portfolio-auth"
  REDIS_HOST: "redis.redis.svc.cluster.local"
  REDIS_PORT: "6379"
